name: "Continuous Integration"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate renovate config
        uses: suzuki-shunsuke/github-action-renovate-config-validator@v2.4.1
        with:
          config_file_path: default.json
